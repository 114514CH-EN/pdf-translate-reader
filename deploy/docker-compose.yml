# 在服务器上（仓库根目录）运行：
#   cp deploy/.env.example deploy/.env   # 然后编辑 deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  pdf-translate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pdf-translate
    restart: unless-stopped
    env_file: .env
    ports:
      # only this machine: Cloudflare Tunnel connects to it locally
      - "127.0.0.1:8003:8003"
    volumes:
      - ./data:/data   # documents, translations, settings — kept across rebuilds
