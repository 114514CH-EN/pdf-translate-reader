# Publishes a GitHub Release when VERSION changes and attaches
#   pdf-translate-reader-vX.zip          the source (git archive, includes the prebuilt frontend/dist)
#   PDFTranslate-vX-windows.zip          the Windows app (PyInstaller on windows-latest, no Python needed)
# Release notes come from .github/release-notes/v<VERSION>.md; editing that file
# later refreshes the notes of the existing release.
name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
      - .github/release-notes/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      created: ${{ steps.check.outputs.exists != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the notes of an existing release
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release edit "$TAG" --notes-file ".github/release-notes/$TAG.md"

      - name: Build the source zip
        if: steps.check.outputs.exists != 'true'
        run: |
          git archive --format=zip --prefix=pdf-translate-reader/ \
            -o "pdf-translate-reader-${{ steps.v.outputs.tag }}.zip" HEAD

      - name: Create the release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" "pdf-translate-reader-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG · PDF 双语翻译阅读器" \
            --notes-file ".github/release-notes/$TAG.md" \
            --latest

  windows-app:
    needs: release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Run the tests
        continue-on-error: true  # reported, but a Windows-only test quirk must not block the download
        working-directory: backend
        run: |
          python -m pip install pytest
          python -m pytest -q tests

      - name: Build PDFTranslate.exe
        run: python tools/build_exe.py

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PDFTranslate\PDFTranslate.exe -ArgumentList '--no-browser' -PassThru
          $h = $null
          for ($i = 0; $i -lt 90 -and -not $h; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/api/health } catch { Start-Sleep 1 }
          }
          if (-not $h.ok) { throw "PDFTranslate.exe did not start" }
          Write-Host "running $($h.version), release $($h.release)"
          if ($h.release -ne (Get-Content VERSION -Raw).Trim()) { throw "VERSION is not bundled" }
          $page = Invoke-WebRequest http://127.0.0.1:8765/pet -UseBasicParsing
          if ($page.StatusCode -ne 200) { throw "pet page missing" }
          # the table finder still works with the unused ONNX models removed
          python tools/make_table_pdf.py table.pdf
          $up = curl.exe -s -F "file=@table.pdf" http://127.0.0.1:8765/api/documents | ConvertFrom-Json
          $blocks = Invoke-RestMethod "http://127.0.0.1:8765/api/documents/$($up.doc_id)/pages/1/blocks"
          $list = if ($blocks.blocks) { $blocks.blocks } else { $blocks }
          if (-not ($list | Where-Object { $_.type -eq 'table' })) { throw "no table found: the pruned build lost a model" }
          # picture text: without an API key the answer must be "configure the API" (400), not "no OCR models" (503)
          $img = $list | Where-Object { $_.type -eq 'image' } | Select-Object -First 1
          if (-not $img) { throw "no image block in the test page" }
          $code = curl.exe -s -o NUL -w "%{http_code}" -X POST "http://127.0.0.1:8765/api/documents/$($up.doc_id)/pages/1/images/$($img.id)/translate"
          if ($code -ne "400") { throw "image translation is not ready in the exe (HTTP $code)" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/shutdown -Headers @{ 'X-PDFTR-Shutdown' = '1' } | Out-Null
          $p.WaitForExit(15000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; throw "exe did not exit" }

      - name: Pack
        shell: pwsh
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          # the smoke test created dist\PDFTranslate\data — never ship it
          Remove-Item -Recurse -Force dist\PDFTranslate\data -ErrorAction SilentlyContinue
          python tools/build_exe.py --pack-only --zip "PDFTranslate-$env:TAG-windows.zip"

      - name: Test the in-app update (swap files, restart)
        shell: pwsh
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          # an installed copy updates itself from the zip that was just packed
          Expand-Archive "PDFTranslate-$env:TAG-windows.zip" -DestinationPath installed
          $app = Resolve-Path installed\PDFTranslate
          Set-Content "$app\_internal\stale-file.txt" "left over from the old version"
          $env:PDFTR_UPDATE_ZIP = (Resolve-Path "PDFTranslate-$env:TAG-windows.zip").Path
          Start-Process -FilePath "$app\PDFTranslate.exe" -ArgumentList '--no-browser'
          $h = $null
          for ($i = 0; $i -lt 90 -and -not $h; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/api/health } catch { Start-Sleep 1 }
          }
          if (-not $h.ok) { throw "installed copy did not start" }
          $old = $h.pid
          New-Item -ItemType Directory -Force "$app\data\keep" | Out-Null
          Set-Content "$app\data\keep\note.txt" "the library must survive"
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/update/install -Headers @{ 'X-PDFTR-Update' = '1' } | Out-Null
          $new = $null
          for ($i = 0; $i -lt 120 -and -not $new; $i++) {
            Start-Sleep 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/health; if ($r.pid -ne $old) { $new = $r } } catch { }
          }
          if (-not $new) {
            try { Invoke-RestMethod http://127.0.0.1:8765/api/update/status | ConvertTo-Json | Write-Host } catch { }
            Get-ChildItem $app | Format-Table Name | Out-String | Write-Host
            throw "the app did not come back after the update"
          }
          Write-Host "restarted: pid $old -> $($new.pid), release $($new.release)"
          Start-Sleep 3
          if (Test-Path "$app\_internal\stale-file.txt") { throw "old program files were not replaced" }
          if (Test-Path "$app\_internal.old") { throw "_internal.old left behind" }
          if (Test-Path "$app\_update") { throw "_update left behind" }
          if (-not (Test-Path "$app\PDFTranslate-Pet.exe")) { throw "PDFTranslate-Pet.exe missing after the update" }
          if (-not (Test-Path "$app\data\keep\note.txt")) { throw "data folder was touched" }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/shutdown -Headers @{ 'X-PDFTR-Shutdown' = '1' } | Out-Null
          Start-Sleep 3

      - name: Upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload $env:TAG "PDFTranslate-$env:TAG-windows.zip" --clobber
