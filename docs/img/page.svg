<?xml version="1.0" encoding="UTF-8"?>
<!--
  小页 —— 桌宠的默认形象：一张折了角的纸，两个折角当耳朵。
  独立 SVG，颜色写死（<img> 里拿不到页面的 CSS 变量），浅色和暗色背景下都靠
  这一圈墨线读出来。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 62">
  <!-- 脚，压在身体后面 -->
  <ellipse cx="24" cy="53.5" rx="5.6" ry="3" fill="#c9cdd6"/>
  <ellipse cx="40" cy="53.5" rx="5.6" ry="3" fill="#c9cdd6"/>
  <!-- 折角耳朵 -->
  <path d="M17 22 L15.5 5.5 L31 16 Z" fill="#fdfcf9" stroke="#3a4150" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M47 22 L48.5 5.5 L33 16 Z" fill="#fdfcf9" stroke="#3a4150" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- 身体：一张微微下坠的纸 -->
  <path
    d="M13 20 Q13 15 18 15 H46 Q51 15 51 20 V43 Q51 51 43 51 H21 Q13 51 13 43 Z"
    fill="#fdfcf9" stroke="#3a4150" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- 右上角的折页 -->
  <path d="M40.5 15.2 H46 Q51 15 51 20 V25.5 Z" fill="#e9ebf1" stroke="#3a4150" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- 脸 -->
  <circle cx="19.4" cy="39" r="2.7" fill="#f3b2be" opacity="0.75"/>
  <circle cx="44.6" cy="39" r="2.7" fill="#f3b2be" opacity="0.75"/>
  <circle cx="25" cy="30.5" r="3.4" fill="#2b3242"/>
  <circle cx="39" cy="30.5" r="3.4" fill="#2b3242"/>
  <circle cx="26.3" cy="29.2" r="1.15" fill="#fdfcf9"/>
  <circle cx="40.3" cy="29.2" r="1.15" fill="#fdfcf9"/>
  <path d="M29.6 37.6 Q32 40.2 34.4 37.6" fill="none" stroke="#2b3242" stroke-width="1.5" stroke-linecap="round"/>
</svg>
